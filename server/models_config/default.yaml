# Default component config for the AI English Voice Companion server.
# Values here reflect poc/results/FINDINGS.md (Phase 1 PoC decisions),
# not the original TZ guesses. Override any value via env vars prefixed
# AI_ENGLISH__ (double underscore = nesting), e.g.:
#   AI_ENGLISH__LLM__MODEL=gemma2:27b
# or point at a whole different file with AI_ENGLISH_CONFIG_FILE=/path/to.yaml

stt:
  engine: whisper_cpp        # whisper.cpp + Core ML
  model: large-v3-turbo
  mode: streaming            # 540ms median (poc/results/stt_engine_spike.md)
  # Persistent whisper-server (ADR-0007): binary/model paths are relative
  # to the repo root. Reuses the PoC's whisper.cpp build rather than
  # re-vendoring a multi-GB C++ project under /server — see ADR-0007.
  whisper_server_bin: poc/whisper.cpp/build/bin/whisper-server
  model_path: poc/whisper.cpp/models/ggml-large-v3-turbo.bin
  language: en
  host: 127.0.0.1
  port: 8781
  startup_timeout_s: 60
  # Measured with bench.stt_eval on 20 recorded lines (2026-11-11):
  #   medium.en 5.7% WER, 0.74s; + context prompt 4.5%, 0.75s;
  #   large-v3-turbo 3.3%, 1.14s; + context prompt 3.0%, 1.25s.
  # large-v3-turbo needs its Core ML encoder
  # (models/generate-coreml-model.sh large-v3-turbo); medium.en stays as
  # the fallback.
  # Pass the character's last reply to whisper as its initial prompt.
  # Off: on a 23s phone clip it sent large-v3-turbo into a repetition
  # loop with Chinese text despite -l en, and it made medium.en "fix" the
  # user's grammar, hiding mistakes a teacher should see (2026-11-11).
  context_prompt: false
  # Keep every user utterance in server/data/debug_audio (gitignored:
  # it's the user's voice). Turn on only for STT evaluation sessions.
  save_utterances: false

llm:
  provider: ollama
  # Primary conversational model — ADR-0012 (was qwen2.5:32b, no longer
  # pulled; qwen3.8:27b measured too slow for live voice at 3.9 tok/s).
  model: gemma2:27b
  learning_layer_model: gemma2:27b   # reserved, non-critical-path use only
  # Re-cache history + the reply just generated while it's being spoken,
  # so the next turn doesn't re-read the reply (ADR-0013: ~-0.4s TTFA).
  reply_prewarm: true
  # In-session context compaction (app/conversation_engine.py): once the
  # history estimate passes trigger_tokens, older turns are summarized in
  # the background and the last keep_recent_messages stay verbatim.
  # Sized for gemma2:27b's 8K window (persona prompt alone is ~520);
  # 0 disables.
  compaction:
    trigger_tokens: 5000
    keep_recent_messages: 6
    # Continuing a past conversation (ADR-0015): above this, it resumes as
    # persona + saved notes + recent messages instead of the whole history.
    # The history is prefilled cold at session start (~135 tok/s: 1.7K
    # tokens took 12.8s), so this is far below trigger_tokens.
    resume_tokens: 1500

tts:
  engine: piper               # default — ~0.6s/chunk
  voice: en_US-lessac-medium
  optional_engine: xtts_v2    # non-default, character-voice variety only
  # Reuses the PoC's already-downloaded Piper voice models (.onnx +
  # .onnx.json), same rationale as stt.whisper_server_bin — see ADR-0007.
  voices_dir: poc/voices

vad:
  engine: silero
  # Pause that triggers an end-of-turn *check* (not the turn end itself):
  # the utterance is transcribed, and if it looks unfinished
  # (app/turn_detection.py) the turn is held open another
  # incomplete_hold_ms for the user to continue. 600 alone cut learners
  # off mid-thought (STORY-05-11 real-device test).
  silence_cutoff_ms: 1000
  incomplete_hold_ms: 2000
  # Extra wait, on top of silence_cutoff_ms, before a finished-looking
  # utterance ends the turn. It is chosen by the session's English level:
  # lower levels pause longer to find a word. The STT call overlaps it,
  # and speech resuming cancels it. Costs latency one for one.
  patience_ms_by_level:
    A2: 900
    B1: 700
    B2: 400
    C1: 150
    native: 0

persistence:
  # Relative to repo root, same convention as stt/tts paths above.
  db_path: server/data/ai_english.db

presets:
  dir: server/data/characters

scenarios:
  dir: server/data/scenarios

latency_budget:
  # ADR-0006 — working target, quiet/normal conditions. Not a hard
  # runtime enforcement, just the number STORY-02-09 validates against.
  ttfa_target_s: 3.0
