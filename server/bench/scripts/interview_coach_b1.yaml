  - user: "Hi Sarah. I want to prepare for an interview for a backend developer position."
    assistant: "Great, let's do it! Is it a big company or a startup, and what technologies do they use?"
  - user: "It's a startup, they use Python and Postgres, and they want someone with some DevOps experience."
    assistant: "Got it. Let's start then. Could you tell me a little about yourself and your experience?"
  - user: "Sure. I have been working as a backend developer for six years. Mostly I build APIs in Python, and I also work with databases and Docker."
