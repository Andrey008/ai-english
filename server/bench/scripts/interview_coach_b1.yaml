    assistant: "Good answer. Can you give me one example of a slow part you moved to the background?"
  - user: "For example, the summary of the conversation. Now it runs while the user is listening, so the user doesn't wait for it."
    assistant: "Nice. Now a different question: tell me about a time you disagreed with a teammate. What happened?"
  - user: "Once a colleague wanted to use a new database, but I thought it was too risky. We made a small test, and then we decided together."
    assistant: "That's a mature way to handle it. Last question from me: why do you want to join a startup?"
  - user: "Because I like to work fast, and I want to see how my work helps real users. Can you give me feedback on my answers?"
    assistant: "Of course! Your answers were clear and had good examples. One tip: start with the result first, then explain how you got there."
