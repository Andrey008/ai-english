[project]
name = "ai-english-server"
version = "0.1.0"
description = "AI English Voice Companion — backend server (EPIC-02)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "piper-tts>=1.7.0",
    "ollama>=0.6.2",
    "silero-vad>=6.2.1",
    "numpy>=2.0",
    "websockets>=13.0",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false

[dependency-groups]
bench = [
    "sounddevice>=0.5.6",
]
dev = [
    "pytest>=9.2.0",
]
